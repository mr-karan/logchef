{{- if and .Values.logchef.enabled (not .Values.logchef.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logchef.apiTokenSecretName" . }}
  labels:
    {{- include "logchef.labels" . | nindent 4 }}
    app.kubernetes.io/component: logchef
  annotations:
    # Keep across helm uninstall so a reinstall reuses the same pepper.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{ include "logchef.apiTokenSecretKey" . }}: {{ include "logchef.apiTokenSecretValue" . | quote }}
{{- end }}
