{{- if and .Values.logchef.enabled (not .Values.logchef.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logchef.logchefServiceName" . }}-config
  labels:
    {{- include "logchef.labels" . | nindent 4 }}
    app.kubernetes.io/component: logchef
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.toml: |
    {{- $config := deepCopy .Values.logchef.config }}
    {{- $oidc := $config.oidc | default dict }}
    {{- $_ := set $oidc "provider_url" (include "logchef.oidcProviderURL" .) }}
    {{- $_ := set $oidc "auth_url" (include "logchef.oidcAuthURL" .) }}
    {{- $_ := set $oidc "token_url" (include "logchef.oidcTokenURL" .) }}
    {{- $_ := set $oidc "redirect_url" (include "logchef.oidcRedirectURL" .) }}
    {{- $_ := set $config "oidc" $oidc }}
    {{- range $section, $settings := $config }}
    [{{ $section | toJson }}]
    {{- range $key, $value := $settings }}
    {{ $key | toJson }} = {{ include "logchef.tomlValue" $value }}
    {{- end }}
    {{- end }}
{{- end }}
