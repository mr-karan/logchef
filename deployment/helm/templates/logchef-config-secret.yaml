{{- if .Values.logchef.enabled }}
{{- $secretName := .Values.logchef.existingSecret | default (include "logchef.logchefServiceName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logchef.logchefServiceName" . }}-config
  labels:
    {{- include "logchef.labels" . | nindent 4 }}
    app.kubernetes.io/component: logchef
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.toml: |
    [server]
    port = {{ .Values.logchef.config.server.port }}
    host = {{ .Values.logchef.config.server.host | quote }}

    [sqlite]
    path = {{ .Values.logchef.config.sqlite.path | quote }}

    [oidc]
    provider_url = {{ include "logchef.oidcProviderURL" . | quote }}
    auth_url = {{ include "logchef.oidcAuthURL" . | quote }}
    token_url = {{ include "logchef.oidcTokenURL" . | quote }}
    client_id = {{ .Values.logchef.config.oidc.client_id | quote }}
    client_secret = {{ .Values.logchef.config.oidc.client_secret | quote }}
    redirect_url = {{ include "logchef.oidcRedirectURL" . | quote }}
    scopes = [{{ range $i, $s := .Values.logchef.config.oidc.scopes }}{{ if $i }}, {{ end }}{{ $s | quote }}{{ end }}]
    skip_email_verified_check = {{ .Values.logchef.config.oidc.skip_email_verified_check | default false }}

    [auth]
    admin_emails = [{{ range $i, $e := .Values.logchef.config.auth.admin_emails }}{{ if $i }}, {{ end }}{{ $e | quote }}{{ end }}]
    session_duration = {{ .Values.logchef.config.auth.session_duration | quote }}
    max_concurrent_sessions = {{ .Values.logchef.config.auth.max_concurrent_sessions }}
    default_token_expiry = {{ .Values.logchef.config.auth.default_token_expiry | quote }}
    {{- if .Values.logchef.config.auth.auto_provision }}
    {{- if .Values.logchef.config.auth.auto_provision.enabled }}

    [auth.auto_provision]
    enabled = true
    allowed_domains = [{{ range $i, $d := .Values.logchef.config.auth.auto_provision.allowed_domains }}{{ if $i }}, {{ end }}{{ $d | quote }}{{ end }}]
    {{- if .Values.logchef.config.auth.auto_provision.default_team_ids }}
    default_team_ids = [{{ range $i, $id := .Values.logchef.config.auth.auto_provision.default_team_ids }}{{ if $i }}, {{ end }}{{ $id }}{{ end }}]
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.logchef.config.ai }}

    [ai]
    enabled = {{ .Values.logchef.config.ai.enabled | default false }}
    {{- with .Values.logchef.config.ai.provider }}
    provider = {{ . | quote }}
    {{- end }}
    {{- with .Values.logchef.config.ai.model }}
    model = {{ . | quote }}
    {{- end }}
    {{- with .Values.logchef.config.ai.base_url }}
    base_url = {{ . | quote }}
    {{- end }}
    {{- with .Values.logchef.config.ai.api_key }}
    api_key = {{ . | quote }}
    {{- end }}
    {{- with .Values.logchef.config.ai.region }}
    region = {{ . | quote }}
    {{- end }}
    {{- end }}

    [logging]
    level = {{ .Values.logchef.config.logging.level | quote }}
{{- end }}
