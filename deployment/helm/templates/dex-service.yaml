{{- if .Values.dex.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logchef.dexServiceName" . }}
  labels:
    {{- include "logchef.labels" . | nindent 4 }}
    app.kubernetes.io/component: dex
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dex.service.type }}
  ports:
    - name: http
      port: {{ .Values.dex.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "logchef.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dex
{{- end }}
