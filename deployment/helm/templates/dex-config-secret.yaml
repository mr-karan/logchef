{{- if .Values.dex.enabled }}
{{- if and (not .Values.dex.connectors) (not (and .Values.dex.enablePasswordDB .Values.dex.staticPasswords)) }}
{{- fail "Configure dex.connectors or enable dex.enablePasswordDB with your own dex.staticPasswords. No demo accounts are installed." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logchef.dexServiceName" . }}-config
  labels:
    {{- include "logchef.labels" . | nindent 4 }}
    app.kubernetes.io/component: dex
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.yaml: |
    issuer: {{ include "logchef.dexIssuer" . | quote }}
    storage:
      {{- toYaml .Values.dex.storage | nindent 6 }}
    web:
      http: 0.0.0.0:{{ .Values.dex.service.port }}
      allowedOrigins: ['*']
    staticClients:
      - id: {{ .Values.logchef.config.oidc.client_id | quote }}
        redirectURIs:
          - {{ include "logchef.oidcRedirectURL" . | quote }}
        name: "Logchef"
        {{- if .Values.logchef.oidc.existingSecret }}
        secretEnv: LOGCHEF_CLIENT_SECRET
        {{- else }}
        secret: {{ required "Set logchef.oidc.existingSecret or logchef.config.oidc.client_secret for the Dex client" .Values.logchef.config.oidc.client_secret | quote }}
        {{- end }}
    oauth2:
      skipApprovalScreen: true
    enablePasswordDB: {{ .Values.dex.enablePasswordDB | default false }}
    {{- if .Values.dex.staticPasswords }}
    staticPasswords:
      {{- range .Values.dex.staticPasswords }}
      - email: {{ .email | quote }}
        hash: {{ .hash | quote }}
        username: {{ .username | quote }}
        userID: {{ .userID | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.dex.connectors }}
    connectors:
{{ toYaml .Values.dex.connectors | nindent 6 }}
    {{- end }}
{{- end }}
