{{- if .Values.dex.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logchef.dexServiceName" . }}-config
  labels:
    {{- include "logchef.labels" . | nindent 4 }}
    app.kubernetes.io/component: dex
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.yaml: |
    issuer: {{ include "logchef.dexIssuer" . | quote }}
    storage:
      type: sqlite3
      config:
        file: /var/dex/dex.db
    web:
      http: 0.0.0.0:{{ .Values.dex.service.port }}
      allowedOrigins: ['*']
    staticClients:
      - id: {{ .Values.logchef.config.oidc.client_id | quote }}
        redirectURIs:
          - {{ include "logchef.oidcRedirectURL" . | quote }}
        name: "Logchef"
        secret: {{ .Values.logchef.config.oidc.client_secret | quote }}
    oauth2:
      skipApprovalScreen: true
    enablePasswordDB: {{ .Values.dex.enablePasswordDB | default false }}
    {{- if .Values.dex.staticPasswords }}
    staticPasswords:
      {{- range .Values.dex.staticPasswords }}
      - email: {{ .email | quote }}
        hash: {{ .hash | quote }}
        username: {{ .username | quote }}
        userID: {{ .userID | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.dex.connectors }}
    connectors:
{{ toYaml .Values.dex.connectors | nindent 6 }}
    {{- end }}
{{- end }}
