version: "2"
run:
  tests: true
linters:
  # On top of the "standard" set (errcheck, govet, ineffassign, staticcheck, unused).
  enable:
    # Bugs and correctness.
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gosec
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - noctx
    - reassign
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - unparam
    - wastedassign
    # Style and maintainability.
    - copyloopvar
    - exptostd
    - gocritic
    - gocyclo
    - intrange
    - misspell
    - modernize
    - nolintlint
    - predeclared
    - revive
    - unconvert
    - usestdlibvars
  settings:
    exhaustive:
      # A default case handles the remaining values on purpose.
      default-signifies-exhaustive: true
    gocritic:
      disabled-checks:
        - hugeParam
        - emptyStringTest
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G104 # Duplicates errcheck.
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    modernize:
      disable:
        # Replacing omitempty with omitzero on struct fields changes JSON output.
        - omitzero
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T"
        # Handlers and interface implementations keep parameters they do not use.
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - dupl
          - gocyclo
          - gosec
          - noctx
        path: _test\.go
      - linters:
          - gosec
        text: 'G107: Potential HTTP request made with variable url'
      - linters:
          - gosec
        path: pkg/models/auth.go
        text: 'G101'
      - linters:
          - gocritic
          - revive
        text: 'TODO:'
      - linters:
          - contextcheck
        text: Function `GetHealth` should pass the context parameter
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  # Report every finding. The defaults (50 per linter, 3 identical) hide most of them.
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mr-karan/logchef
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
