name: Logchef CLI

on:
  push:
    paths:
      - "cli/**"
      - ".agents/skills/logchef/**"
      - ".agents/skills/logchef-setup/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".agents/skills/logchef/**"
      - ".agents/skills/logchef-setup/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-cli.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The CLI embeds the skills from cli/crates/logchef-cli/skill and
      # skill-setup (they must live inside the Cargo workspace for cross
      # release builds). Guard them against drift from the canonical copies
      # in .agents/skills.
      - name: Skill copies in sync with canonical sources
        run: |
          diff -r .agents/skills/logchef cli/crates/logchef-cli/skill
          diff -r .agents/skills/logchef-setup cli/crates/logchef-cli/skill-setup

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli

      - name: Format
        run: cargo fmt --check
        working-directory: cli

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: cli

      - name: Test
        run: cargo test
        working-directory: cli
