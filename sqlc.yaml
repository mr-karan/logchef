version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/store/sqlite/queries.sql"
    schema: "internal/store/sqlite/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlite/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
  - engine: "postgresql"
    queries: "internal/store/postgres/queries.sql"
    schema: "internal/store/postgres/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
