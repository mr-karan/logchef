[package]
name = "logchef-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Logchef CLI - A sophisticated log viewer for Logchef"

[[bin]]
name = "logchef"
path = "src/main.rs"

[dependencies]
logchef-core.workspace = true
tokio.workspace = true
reqwest.workspace = true
clap.workspace = true
clap_complete.workspace = true
include_dir.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
inquire.workspace = true
iana-time-zone.workspace = true
url.workspace = true
open.workspace = true

[dev-dependencies]
# Already in the workspace through logchef-core. The in-test OAuth server
# uses them to verify the PKCE S256 challenge.
base64 = "0.23.1"
sha2 = "0.11.0"
